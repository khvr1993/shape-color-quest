<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shape Color Quest ⭐</title>
<meta name="description" content="A fun, friendly game for 3-6 year olds to learn shapes and colors. Find the shape, tap it, earn stars!">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1:#FFF7D6; --bg2:#FFE3F1; --card:#fff; --ink:#2D2A4A; --muted:#7A7699;
    --accent:#FF6B9D; --accent2:#6C5CE7; --sun:#FFC93C; --green:#2ED573; --radius:28px;
  }
  html,body{height:100%}
  body{
    margin:0; font-family: ui-rounded, "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, #D6F0FF 100%);
    min-height:100dvh; display:flex; justify-content:center; padding:14px 14px 28px;
  }
  body::before{
    content:"⭐  🔺  🟦  💛  🟣  ⭐"; position:fixed; inset:auto 0 -8px 0; text-align:center;
    font-size:22px; opacity:.18; pointer-events:none; letter-spacing:14px;
  }
  .wrap{width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; position:relative; z-index:1}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px}
  h1{font-size:clamp(24px,6vw,36px); margin:0; letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .pills{display:flex; gap:8px; flex-wrap:wrap}
  .pill{background:var(--card); border-radius:999px; padding:8px 14px; font-weight:800; font-size:18px;
    box-shadow:0 4px 0 rgba(45,42,74,.08); display:flex; align-items:center; gap:6px}
  .toggles{display:flex; gap:8px}
  button{font-family:inherit; cursor:pointer; border:0}
  .icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:22px;
    box-shadow:0 4px 0 rgba(45,42,74,.12); display:grid;place-items:center}
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(45,42,74,.12)}
  .prompt-card{background:var(--card); border-radius:var(--radius); padding:18px 16px; text-align:center;
    box-shadow:0 8px 0 rgba(45,42,74,.07)}
  .prompt-label{font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:800}
  .prompt{font-size:clamp(28px,7vw,42px); font-weight:900; margin:6px 0 10px; line-height:1.15}
  .prompt .c{ text-transform:capitalize; }
  .speak{background:linear-gradient(135deg,var(--accent),#FF9A5A); color:#fff; border-radius:999px;
    padding:12px 22px; font-size:19px; font-weight:900; box-shadow:0 5px 0 #D94F7A}
  .speak:active{transform:translateY(3px); box-shadow:0 2px 0 #D94F7A}
  .encourage{min-height:28px; font-size:20px; font-weight:800; color:var(--accent2); text-align:center}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media (max-width:380px){ .grid{grid-template-columns:repeat(2,1fr)} }
  .tile{aspect-ratio:1; background:var(--card); border-radius:24px; display:grid; place-items:center;
    box-shadow:0 6px 0 rgba(45,42,74,.08); transition:transform .12s, box-shadow .12s; position:relative; overflow:hidden}
  .tile:active{transform:scale(.96)}
  .tile svg{width:68%; height:68%; filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
  .tile.correct{background:#D9FFE8; box-shadow:0 6px 0 #2ED573}
  .tile.wrong{animation:wiggle .4s}
  @keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pop{position:absolute; font-size:28px; animation:pop .6s forwards; pointer-events:none}
  @keyframes pop{to{transform:translateY(-46px) scale(1.4); opacity:0}}
  .progress{background:var(--card); border-radius:999px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-weight:800}
  .dots{flex:1; display:flex; gap:6px; justify-content:center}
  .dot{width:22px;height:22px;border-radius:50%;background:#EEEAFB; display:grid;place-items:center; font-size:13px}
  .dot.on{background:var(--sun)}
  .reward{text-align:center; font-size:20px; font-weight:900; min-height:30px}
  .footer{text-align:center; color:var(--muted); font-size:14px; font-weight:700}
  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:10}
  .confetti i{position:absolute; font-style:normal; animation:fall 1.6s ease-in forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:0}}
  .level{font-size:14px; color:var(--muted); font-weight:800; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shape <span>Color</span> Quest ⭐</h1>
    <div class="toggles">
      <button class="icon-btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
      <button class="icon-btn" id="voiceBtn" aria-label="Voice on or off">🗣️</button>
    </div>
  </header>

  <div class="pills">
    <div class="pill">⭐ <span id="stars">0</span></div>
    <div class="pill">🏆 <span id="score">0</span></div>
    <div class="pill">🔥 <span id="streak">0</span></div>
    <div class="pill" id="levelPill">⭐ Level 1</div>
  </div>

  <div class="prompt-card">
    <div class="prompt-label">Can you find…</div>
    <div class="prompt" id="promptText">Tap to start!</div>
    <button class="speak" id="speakBtn">🔊 Hear it!</button>
  </div>

  <div class="encourage" id="encourage">Ready to play?</div>

  <div class="grid" id="grid" aria-label="Shapes to choose from"></div>

  <div class="progress">
    <span>🎁</span>
    <div class="dots" id="dots"></div>
    <span id="goalText">0 / 5</span>
  </div>
  <div class="reward" id="reward"></div>
  <div class="level" id="levelText">Find the shape and tap it!</div>
  <div class="footer">Made for little learners ages 3-6 • Tap Hear it! to listen again</div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const SHAPES = [
  {id:'circle', name:'circle'}, {id:'square', name:'square'}, {id:'triangle', name:'triangle'},
  {id:'star', name:'star'}, {id:'heart', name:'heart'}, {id:'diamond', name:'diamond'},
  {id:'rectangle', name:'rectangle'}, {id:'oval', name:'oval'}
];
const COLORS = [
  {id:'red', name:'red', hex:'#FF5252'}, {id:'blue', name:'blue', hex:'#3A86FF'},
  {id:'green', name:'green', hex:'#2ED573'}, {id:'yellow', name:'yellow', hex:'#FFC93C'},
  {id:'purple', name:'purple', hex:'#9B5DE5'}, {id:'orange', name:'orange', hex:'#FF9F1C'},
  {id:'pink', name:'pink', hex:'#FF6B9D'}
];
const PRAISE = ['Great job!','Wow, super!','You did it!','Amazing!','Hooray!','Brilliant!','Well done!','Fantastic!'];
const TRY = ['Try again!','Almost! Look carefully!','You can do it!','Try another one!'];
const REWARDS = ['🦁','🐶','🦄','🐸','🦋','🐙','🦉','🐢'];

let stars=0, score=0, streak=0, level=1, roundCount=0, soundOn=true, voiceOn=true, target=null, board=[];
let audioCtx;
const $ = id => document.getElementById(id);
const grid=$('grid'), promptEl=$('promptText'), encourageEl=$('encourage');

function tileCount(){ return level===1 ? 4 : level===2 ? 6 : 8; }
function shapeSVG(shapeId, color){
  const c=color.hex, id=shapeId;
  const paths={
    circle:`<circle cx="50" cy="50" r="38" fill="${c}"/>`,
    square:`<rect x="14" y="14" width="72" height="72" rx="12" fill="${c}"/>`,
    rectangle:`<rect x="8" y="26" width="84" height="48" rx="12" fill="${c}"/>`,
    triangle:`<path d="M50 12 L92 86 L8 86 Z" fill="${c}" stroke-linejoin="round"/>`,
    star:`<path d="M50 8 L62 38 L94 40 L69 60 L78 91 L50 72 L22 91 L31 60 L6 40 L38 38 Z" fill="${c}" stroke-linejoin="round"/>`,
    heart:`<path d="M50 86 C20 62 10 44 10 30 C10 16 22 9 34 13 C42 15 48 22 50 28 C52 22 58 15 66 13 C78 9 90 16 90 30 C90 44 80 62 50 86Z" fill="${c}"/>`,
    diamond:`<path d="M50 8 L90 50 L50 92 L10 50 Z" fill="${c}" stroke-linejoin="round"/>`,
    oval:`<ellipse cx="50" cy="50" rx="42" ry="30" fill="${c}"/>`
  };
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${paths[id]||paths.circle}</svg>`;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function makeRound(){
  roundCount++;
  level = roundCount<=3 ? 1 : roundCount<=7 ? 2 : 3;
  target = { shape: pick(SHAPES), color: pick(COLORS) };
  const count = tileCount();
  board = [{...target}];
  // Distractors: half share the colour, half share the shape — teaches careful looking
  while(board.length < count){
    const useSameColor = board.length % 2 === 0;
    let cand;
    if(useSameColor){
      const other = pick(SHAPES.filter(s=>s.id!==target.shape.id));
      cand = { shape: other, color: target.color };
    } else {
      const other = pick(COLORS.filter(c=>c.id!==target.color.id));
      cand = { shape: target.shape, color: other };
    }
    if(!board.some(b=>b.shape.id===cand.shape.id && b.color.id===cand.color.id)) board.push(cand);
  }
  board = shuffle(board);
  renderPrompt();
  renderGrid();
  updateHUD();
  speak(`Find the ${target.color.name} ${target.shape.name}!`);
}
function renderPrompt(){
  promptEl.innerHTML = `Find the <span class="c" style="color:${target.color.hex}">${target.color.name}</span> ${target.shape.name}!`;
}
function renderGrid(){
  grid.innerHTML='';
  grid.style.gridTemplateColumns = tileCount()===4 ? 'repeat(2,1fr)' : 'repeat(3,1fr)';
  board.forEach(item=>{
    const b=document.createElement('button');
    b.className='tile'; b.type='button';
    b.setAttribute('aria-label', `${item.color.name} ${item.shape.name}`);
    b.innerHTML = shapeSVG(item.shape.id, item.color);
    b.onclick=()=>onTap(b,item);
    grid.appendChild(b);
  });
}
function onTap(el,item){
  if(el.classList.contains('correct')) return;
  if(item.shape.id===target.shape.id && item.color.id===target.color.id){
    el.classList.add('correct');
    const pop=document.createElement('span'); pop.className='pop'; pop.textContent='⭐'; el.appendChild(pop);
    streak++; stars+=1; score+=10+Math.min(streak,5)*2;
    encourageEl.textContent = pick(PRAISE);
    playHappy(); confetti();
    if(streak%5===0){ celebrate(); }
    updateHUD();
    setTimeout(makeRound, 850);
  } else {
    el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),450);
    streak=0; encourageEl.textContent = pick(TRY);
    playOops(); updateHUD();
    // Gentle hint: speak the target again
    speak(`Find the ${target.color.name} ${target.shape.name}!`);
  }
}
function updateHUD(){
  $('stars').textContent=stars; $('score').textContent=score; $('streak').textContent=streak;
  $('levelPill').textContent=`⭐ Level ${level}`;
  $('levelText').textContent = level===1 ? 'Level 1: 4 shapes — easy!' : level===2 ? 'Level 2: 6 shapes — tricky!' : 'Level 3: 8 shapes — superstar!';
  const inGoal = stars % 5;
  $('goalText').textContent = `${inGoal} / 5`;
  $('dots').innerHTML = Array.from({length:5},(_,i)=>`<span class="dot ${i<inGoal?'on':''}">${i<inGoal?'⭐':''}</span>`).join('');
  if(stars>0 && inGoal===0){ $('reward').textContent = `You earned a ${pick(REWARDS)} sticker! Keep going!`; }
}
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.rate=.92; u.pitch=1.15; speechSynthesis.speak(u);
}
function beep(freq, t, dur=.14, type='sine', vol=.18){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+t+dur);
    o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+dur);
  }catch(e){}
}
function playHappy(){ [523,659,784,1047].forEach((f,i)=>beep(f,i*.09)); }
function playOops(){ beep(300,0,.15,'triangle',.12); beep(260,.12,.18,'triangle',.12); }
function celebrate(){ [523,659,784,1047,1319].forEach((f,i)=>beep(f,i*.1,.2)); confetti(true); }
function confetti(big=false){
  const box=$('confetti'); const em=['⭐','🎉','💛','💜','💙','🧡'];
  for(let i=0;i<(big?36:14);i++){
    const s=document.createElement('i'); s.textContent=pick(em);
    s.style.left=Math.random()*100+'vw'; s.style.top='-40px';
    s.style.fontSize=(18+Math.random()*22)+'px'; s.style.animationDelay=(Math.random()*.3)+'s';
    box.appendChild(s); setTimeout(()=>s.remove(),2000);
  }
}
$('speakBtn').onclick=()=> target && speak(`Find the ${target.color.name} ${target.shape.name}!`);
$('soundBtn').onclick=e=>{ soundOn=!soundOn; e.target.textContent=soundOn?'🔊':'🔇'; };
$('voiceBtn').onclick=e=>{ voiceOn=!voiceOn; e.target.textContent=voiceOn?'🗣️':'🤫'; if(!voiceOn) speechSynthesis.cancel(); };
grid.addEventListener('click', ()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }, {once:true});
makeRound();
</script>
</body>
</html>
